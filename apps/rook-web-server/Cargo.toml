[package]
name = "rook-web-server"
description = "A headless Rook client streamed to a browser: the web port's server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rook-web-server"
path = "src/main.rs"

[dependencies]
rook-types.workspace = true
rook-scene.workspace = true
rook-content.workspace = true
rook-engine.workspace = true
rook-client.workspace = true
rook-render.workspace = true
rook-gui.workspace = true
rook-dom.workspace = true
rook-lua.workspace = true
rook-formats.workspace = true
rook-platform = { workspace = true, features = ["native"] }
blake3.workspace = true
anyhow.workspace = true
clap.workspace = true
glam.workspace = true
image.workspace = true
rmp-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
rustc-hash.workspace = true

axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
futures-util = "0.3"

[lints]
workspace = true
