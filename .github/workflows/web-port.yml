# Checks the web port: the headless server (a workspace member) and the
# browser client, on GitHub's machines. Upstream's check.yml covers the
# rest of the workspace.
name: Web port

on:
  push:
    branches: [main, web-port]
    paths:
      - "apps/rook-web-server/**"
      - "web-client/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web-port.yml"
  pull_request:
    paths:
      - "apps/rook-web-server/**"
      - "web-client/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/web-port.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Headless server
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-port

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p rook-web-server --all-targets -- -D warnings
      - run: cargo build -p rook-web-server --release

      - name: Smoke test
        run: |
          python3 -m venv /tmp/rook-venv
          /tmp/rook-venv/bin/pip install --quiet websockets msgpack
          /tmp/rook-venv/bin/python apps/rook-web-server/tests/smoke.py ./target/release/rook-web-server

      - uses: actions/upload-artifact@v4
        with:
          name: rook-web-server
          path: target/release/rook-web-server
          if-no-files-found: error

  arm64:
    name: Headless server (aarch64)
    # 24.04 keeps the binary's glibc no newer than the phone's; the runner
    # is x86_64, so this is a cross build.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-port-arm64

      - run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - run: cargo build -p rook-web-server --release --target aarch64-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: rook-web-server-aarch64
          path: target/aarch64-unknown-linux-gnu/release/rook-web-server
          if-no-files-found: error

  client:
    name: Browser client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-client/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-client
          path: web-client/dist
          if-no-files-found: error
